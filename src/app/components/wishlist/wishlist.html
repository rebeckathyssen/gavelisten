<div class="wishes">
  @for (wish of wishlist(); track wish.id) {
  <article class="wish-card" (click)="editWish.emit(wish)">
    <div class="wish-card__header">
      <h3 class="wish-card__name">{{ wish.name }}</h3>
      <div class="wish-card__actions">
        @if (wish.link) {
        <a
          [href]="normalizeUrl(wish.link)"
          target="_blank"
          rel="noopener noreferrer external"
          class="wish-card__link"
          aria-label="Åbn link"
          (click)="$event.stopPropagation()"
        >
          <i class="fa-solid fa-link"></i>
        </a>
        } @if (wish.status !== 'pakket-ind') {
        <button
          class="wish-card__btn wish-card__btn--check"
          (click)="$event.stopPropagation(); markAsBought.emit(wish)"
          [attr.aria-label]="
            wish.status === 'købt' ? 'Marker som pakket ind' : 'Marker som købt'
          "
        >
          <i
            class="fa-solid"
            [class.fa-check]="wish.status === 'mangler'"
            [class.fa-gift]="wish.status === 'købt'"
          ></i>
        </button>
        }
        <button
          class="wish-card__btn wish-card__btn--delete"
          (click)="$event.stopPropagation(); deleteWish.emit(wish)"
          [disabled]="deletingWishId() === wish.id"
          aria-label="Slet"
        >
          @if (deletingWishId() === wish.id) {
          <i class="fa-solid fa-spinner fa-spin"></i>
          } @else {
          <i class="fa-solid fa-trash"></i>
          }
        </button>
      </div>
    </div>

    <div class="wish-card__meta">
      <span class="wish-card__price">
        {{ wish.price | currency : 'DKK' : 'symbol' : '1.0-0' : 'da-DK' }}
      </span>
      <span
        class="wish-card__status"
        [class.wish-card__status--mangler]="wish.status === 'mangler'"
        [class.wish-card__status--købt]="wish.status === 'købt'"
        [class.wish-card__status--pakket]="wish.status === 'pakket-ind'"
      >
        <i class="fa-solid fa-{{ statusIcon(wish.status) }}"></i>
        {{ statusText(wish.status) }}
      </span>
    </div>

    @if (wish.notes) {
    <p class="wish-card__notes">{{ wish.notes }}</p>
    }
  </article>
  } @empty {
  <div class="empty-state">
    <i class="fa-solid fa-gift"></i>
    <p>Ingen ønsker endnu</p>
  </div>
  }
</div>
