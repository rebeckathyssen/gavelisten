<div class="giftlist">
  @if (person(); as p) {
  <div class="giftlist__header">
    <button class="giftlist__back" (click)="close()" aria-label="Tilbage">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <div class="giftlist__person">
      <span class="giftlist__avatar">{{ p.avatar ?? '🙂' }}</span>
      <h1 class="giftlist__title">{{ p.name }}</h1>
    </div>
    <div class="giftlist__menu-wrapper">
      <button
        class="giftlist__menu-btn"
        (click)="togglePersonMenu()"
        aria-label="Åbn menu"
      >
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </button>
      
      @if (showPersonMenu()) {
      <div class="giftlist__dropdown">
        <div class="giftlist__dropdown-overlay" (click)="closePersonMenu()"></div>
        <div class="giftlist__dropdown-menu">
          <button
            class="giftlist__dropdown-item"
            (click)="startEditingPerson()"
          >
            <i class="fa-solid fa-pencil"></i>
            <span>Rediger person</span>
          </button>
          <button
            class="giftlist__dropdown-item giftlist__dropdown-item--danger"
            (click)="deletePerson()"
            [disabled]="isDeletingPerson()"
          >
            @if (isDeletingPerson()) {
            <i class="fa-solid fa-spinner fa-spin"></i>
            } @else {
            <i class="fa-solid fa-trash"></i>
            }
            <span>Slet person</span>
          </button>
        </div>
      </div>
      }
    </div>
  </div>

  @if (isEditingPerson()) {
  <div class="edit-person-modal">
    <div class="edit-person-modal__overlay" (click)="cancelEditingPerson()"></div>
    <div class="edit-person-modal__content">
      <h2 class="edit-person-modal__title">Rediger {{ p.name }}</h2>
      
      <form (ngSubmit)="savePersonEdit()">
        <div class="form-group">
          <label for="edit-name">Navn</label>
          <input
            type="text"
            id="edit-name"
            [(ngModel)]="editName"
            name="name"
            required
          />
        </div>

        <div class="form-group">
          <label for="edit-budget">Budget (DKK)</label>
          <input
            type="number"
            id="edit-budget"
            [(ngModel)]="editBudget"
            name="budget"
            min="0"
            step="50"
            required
          />
        </div>

        <div class="form-actions">
          <button
            type="button"
            class="btn btn--secondary"
            (click)="cancelEditingPerson()"
            [disabled]="isSavingPerson()"
          >
            Annuller
          </button>
          <button
            type="submit"
            class="btn btn--primary"
            [disabled]="isSavingPerson()"
          >
            @if (isSavingPerson()) {
              <i class="fa-solid fa-spinner fa-spin"></i>
              Gemmer...
            } @else {
              <i class="fa-solid fa-check"></i>
              Gem
            }
          </button>
        </div>
      </form>
    </div>
  </div>
  }

  <div class="giftlist__main">
    <div class="tabs">
      <button
        class="tab"
        [class.tab--active]="activeTab() === 'wishlist'"
        (click)="switchTab('wishlist')"
      >
        <i class="fa-solid fa-list"></i>
        Ønskeliste
      </button>
      <button
        class="tab"
        [class.tab--active]="activeTab() === 'ideas'"
        (click)="switchTab('ideas')"
      >
        <i class="fa-solid fa-lightbulb"></i>
        Mine idéer
      </button>
    </div>

    <div class="content">
      @if (activeTab() === 'wishlist') {
      <app-wishlist
        [wishlist]="wishlist()"
        [deletingWishId]="deletingWishId()"
        (editWish)="editWish($event)"
        (markAsBought)="markAsBought($event)"
        (deleteWish)="deleteWish($event)"
      />
      } @else {
      <app-ideaslist
        [ideas]="ideas()"
        [deletingWishId]="deletingWishId()"
        (editWish)="editWish($event)"
        (markAsBought)="markAsBought($event)"
        (deleteWish)="deleteWish($event)"
      />
      }

      <button class="add-wish-btn" (click)="addWish()">
        <i class="fa-solid fa-plus"></i>
        Tilføj {{ activeTab() === 'wishlist' ? 'ønske' : 'idé' }}
      </button>

      <button class="upload-wishlist-btn" (click)="openWishUploader()">
        <i class="fa-solid fa-file-import"></i>
        Upload ønskeliste
      </button>
    </div>

    <div class="giftlist__actions">
      <button
        class="giftlist__complete"
        [class.giftlist__complete--active]="p.completed"
        (click)="toggleComplete()"
        [attr.aria-label]="p.completed ? 'Marker som ikke færdig' : 'Marker som færdig'"
      >
        <i
          class="fa-solid"
          [class.fa-check]="p.completed"
          [class.fa-flag-checkered]="!p.completed"
        ></i>
        <span>{{ p.completed ? 'Færdig' : 'Marker som færdig' }}</span>
      </button>
    </div>
  </div>
  } @else {
  <div class="loading">
    <i class="fa-solid fa-spinner fa-spin"></i>
    <p>Indlæser...</p>
  </div>
  }

  <app-wish-adder-logic
    [show]="showWishUploader()"
    (close)="closeWishUploader()"
    (confirm)="handleBulkWishes($event)"
  />
</div>
