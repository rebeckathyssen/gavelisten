<div class="wish-add">
  @if (person(); as p) {
  <div class="wish-add__header">
    <button class="wish-add__back" (click)="cancel()" aria-label="Tilbage">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <div>
      <h1 class="wish-add__title">Tilføj {{ type() === 'wishlist' ? 'ønske' : 'idé' }}</h1>
      <p class="wish-add__subtitle">For {{ p.name }}</p>
    </div>
  </div>

  <div class="form-container">
    <form (ngSubmit)="save()">
      <div class="form-group">
        <label for="name">Navn *</label>
        <input 
          type="text" 
          id="name" 
          [(ngModel)]="name" 
          name="name"
          placeholder="F.eks. LEGO Star Wars"
          required
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="price">Pris (DKK) *</label>
          <input 
            type="number" 
            id="price" 
            [(ngModel)]="price" 
            name="price"
            min="0"
            step="10"
            required
          />
        </div>

        <div class="form-group">
          <label>Status</label>
          <div class="status-buttons">
            @for (status of statuses; track status.value) {
              <button 
                type="button"
                class="status-btn"
                [class.status-btn--selected]="selectedStatus() === status.value"
                (click)="selectStatus(status.value)"
              >
                <i class="fa-solid fa-{{ status.icon }}"></i>
                <span>{{ status.label }}</span>
              </button>
            }
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="link">Link (valgfrit)</label>
        <input 
          type="url" 
          id="link" 
          [(ngModel)]="link" 
          name="link"
          placeholder="https://..."
        />
      </div>

      <div class="form-group">
        <label for="notes">Noter (valgfrit)</label>
        <textarea 
          id="notes" 
          [(ngModel)]="notes" 
          name="notes"
          rows="4"
          placeholder="Tilføj detaljer, farve, størrelse, osv."
        ></textarea>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn--secondary" (click)="cancel()">
          Annuller
        </button>
        <button type="submit" class="btn btn--primary">
          <i class="fa-solid fa-check"></i>
          Gem
        </button>
      </div>
    </form>
  </div>
  } @else {
  <div class="loading">
    <p>Indlæser...</p>
  </div>
  }
</div>
