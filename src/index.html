<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gavelisten</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preload" as="image" href="/logo.png">
  <style>
    .preload-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-deep-red, #8e2c24);
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.3s ease-in;
      pointer-events: none;
    }
    .preload-screen.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="preload-screen" id="preload"></div>
  <app-root></app-root>
  <script>
    // Wait for all resources to load before hiding the preload screen
    function hidePreload() {
      const preload = document.getElementById('preload');
      if (preload) {
        preload.classList.add('hidden');
        setTimeout(() => preload.remove(), 300);
      }
    }

    // Preload critical resources
    const logo = new Image();
    logo.src = '/logo.png';

    // Wait for fonts, logo, and Angular to render
    Promise.all([
      document.fonts.ready,
      new Promise((resolve) => {
        if (logo.complete) {
          resolve();
        } else {
          logo.onload = resolve;
          logo.onerror = resolve;
        }
      }),
      // Wait for Angular to actually render content
      new Promise((resolve) => {
        const checkForContent = () => {
          const appRoot = document.querySelector('app-root');
          if (appRoot && appRoot.children.length > 0) {
            resolve();
          } else {
            requestAnimationFrame(checkForContent);
          }
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', checkForContent);
        } else {
          checkForContent();
        }
      })
    ]).then(() => {
      hidePreload();
    });
  </script>
</body>
</html>
